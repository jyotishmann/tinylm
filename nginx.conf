# nginx.conf
# Nginx config for the TinyLM frontend container.
# Two responsibilities:
#   1. Serve the React SPA (with fallback for HashRouter)
#   2. Reverse-proxy /api/* and /ws/* to the backend service

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA: send all non-asset requests to index.html ──────────
    # HashRouter (#/generate) doesn't need this, but it's good practice.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────
    # Matches the Vite proxy config from development.
    # BACKEND_HOST is set by docker-compose via env var substitution.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # Generation can take up to 2 min on CPU
    }

    # ── WebSocket reverse proxy ───────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;   # Streaming can run for several minutes
    }

    # ── Static asset caching ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}